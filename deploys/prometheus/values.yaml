# Prometheus Helm Chart Values
# Chart: prometheus-community/prometheus
# Docs: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus

server:
  retention: "15d"

  persistentVolume:
    enabled: true
    size: 50Gi

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  ingress:
    enabled: true
    ingressClassName: contour
    hosts:
      - prometheus.pud.ink
    tls:
      - hosts:
          - prometheus.pud.ink

alertmanager:
  enabled: true

  persistentVolume:
    enabled: true
    size: 2Gi

  ingress:
    enabled: true
    ingressClassName: contour
    hosts:
      - alertmanager.pud.ink
    tls:
      - hosts:
          - alertmanager.pud.ink

pushgateway:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
