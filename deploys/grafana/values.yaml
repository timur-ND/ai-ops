# Grafana Helm Chart Values
# Chart: grafana/grafana
# Docs: https://github.com/grafana/helm-charts/tree/main/charts/grafana

replicas: 1

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  ingressClassName: contour
  hosts:
    - grafana.pud.ink
  tls:
    - hosts:
        - grafana.pud.ink

# Admin credentials (change in production!)
adminUser: admin
# adminPassword: set via --set or secret

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true

      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        url: http://victorialogs.monitoring.svc.cluster.local:9428
        access: proxy

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

plugins:
  - grafana-piechart-panel
  - victoriametrics-logs-datasource

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
  datasources:
    enabled: true
    label: grafana_datasource
