# HTTPRoute for VictoriaLogs
# Uses Contour Gateway with wildcard TLS certificate
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  parentRefs:
    - name: contour
      namespace: projectcontour
  hostnames:
    - victorialogs.pud.ink
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: victorialogs-victoria-logs-single-server
          port: 9428
