# VictoriaLogs Helm Chart Values
# Chart: victoriametrics/victoria-logs-single
# Docs: https://github.com/VictoriaMetrics/helm-charts/tree/master/charts/victoria-logs-single

server:
  retentionPeriod: 30d

  persistentVolume:
    enabled: true
    size: 50Gi

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  ingress:
    enabled: true
    ingressClassName: contour
    hosts:
      - name: victorialogs.pud.ink
        path: /
    tls:
      - hosts:
          - victorialogs.pud.ink

fluent-bit:
  enabled: true

  config:
    outputs: |
      [OUTPUT]
          Name http
          Match kube.*
          Host victorialogs
          Port 9428
          URI /insert/jsonline?_stream_fields=stream,kubernetes_pod_name,kubernetes_container_name,kubernetes_namespace_name&_msg_field=log&_time_field=date
          Format json_lines
          Json_date_format iso8601
          Header AccountID 0

    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Merge_Log On
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude On

      [FILTER]
          Name nest
          Match kube.*
          Operation lift
          Nested_under kubernetes
          Add_prefix kubernetes_
