# RBAC for AI-Ops MCP Server
#
# Permissions:
#   - ClusterRole: read-only across entire cluster
#   - RoleBinding: full access to 'monitoring' namespace only
#
# Usage:
#   kubectl apply -f k8s-mcp-rbac.yaml
#
#   # Generate kubeconfig for MCP server
#   ./generate-kubeconfig.sh

---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/managed-by: ai-ops

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-ops
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ai-ops
    app.kubernetes.io/component: mcp-server

---
# ClusterRole: Read-only access to entire cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-ops-cluster-reader
  labels:
    app.kubernetes.io/name: ai-ops
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - namespaces
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - nodes
      - events
      - serviceaccounts
    verbs: ["get", "list", "watch"]

  # Apps
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]

  # Batch
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs: ["get", "list", "watch"]

  # Gateway API
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - gatewayclasses
      - httproutes
      - tcproutes
      - tlsroutes
      - referencegrants
    verbs: ["get", "list", "watch"]

  # Contour specific
  - apiGroups: ["projectcontour.io"]
    resources:
      - httpproxies
      - tlscertificatedelegations
    verbs: ["get", "list", "watch"]

  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]

  # Helm releases (secrets with helm metadata)
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
    # Note: needed for 'helm list' and 'helm history'

---
# ClusterRoleBinding: Apply read-only across cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-ops-cluster-reader
  labels:
    app.kubernetes.io/name: ai-ops
subjects:
  - kind: ServiceAccount
    name: ai-ops
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: ai-ops-cluster-reader
  apiGroup: rbac.authorization.k8s.io

---
# RoleBinding: Full access to 'monitoring' namespace
# Uses built-in 'admin' ClusterRole which grants full access within namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-ops-namespace-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ai-ops
subjects:
  - kind: ServiceAccount
    name: ai-ops
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io

# ---
# To add more namespaces with full access, duplicate the RoleBinding:
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: ai-ops-namespace-admin
#   namespace: <OTHER_NAMESPACE>
# subjects:
#   - kind: ServiceAccount
#     name: ai-ops
#     namespace: monitoring
# roleRef:
#   kind: ClusterRole
#   name: admin
#   apiGroup: rbac.authorization.k8s.io
