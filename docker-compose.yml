services:
  mcp-grafana:
    image: ghcr.io/grafana/mcp-grafana:latest
    container_name: mcp-grafana
    network_mode: host
    environment:
      - GRAFANA_URL=${GRAFANA_URL}
      - GRAFANA_TOKEN=${GRAFANA_TOKEN}
    restart: unless-stopped
    stdin_open: true
    tty: true

  mcp-victorialogs:
    image: ghcr.io/victoriametrics-community/mcp-victorialogs:latest
    container_name: mcp-victorialogs
    network_mode: host
    environment:
      - VICTORIALOGS_ADDR=${VICTORIALOGS_URL}
      - VICTORIALOGS_ACCOUNT_ID=${VICTORIALOGS_ACCOUNT_ID:-0}
      - VICTORIALOGS_TOKEN=${VICTORIALOGS_TOKEN}
    restart: unless-stopped
    stdin_open: true
    tty: true

  mcp-kubernetes:
    image: mcpk8s/server:latest
    container_name: mcp-kubernetes
    volumes:
      # Use generated kubeconfig with limited permissions
      # Generate with: ./generate-kubeconfig.sh
      - ${KUBECONFIG_PATH:-./kubeconfig-ai-ops.yaml}:/home/nonroot/.kube/config:ro
    restart: unless-stopped
    stdin_open: true
    tty: true
